name: CI

on:
  push:
    branches: [socialflow-lite]
  pull_request:
    branches: [socialflow-lite]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The race detector needs cgo, so it runs here rather than on every machine.
      - run: go test -race ./...
      - run: docker build -t socialflow-lite .
